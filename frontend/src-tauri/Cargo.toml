[package]
name = "app"
version = "0.1.1"
description = "Atlas — a local-first intelligent second brain"
authors = ["Atlas"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `tray-icon` + `image-png` power the system-tray presence; without them the app
# has nowhere to live when its window is closed.
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
# Desktop-only in use (see the #[cfg(desktop)] guards in lib.rs), but declared as
# ordinary dependencies on purpose: tauri-build only harvests permission schemas
# from [dependencies], so target-gating these makes their `:default` permissions
# unresolvable in capabilities/default.json.
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
